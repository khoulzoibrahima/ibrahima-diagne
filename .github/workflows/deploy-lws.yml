name: Deploy static site to LWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lws-ftp
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: PRODUCTION
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload files to LWS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ vars.LWS_FTP_SERVER }}
          username: ${{ vars.LWS_FTP_USERNAME }}
          password: ${{ secrets.LWS_FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
